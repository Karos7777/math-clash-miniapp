name: Android APK

on:
  push:
    branches:
      - main
      - claude/math-clash-android-app-pq68jn
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make the wrapper runnable
        run: chmod +x android/gradlew

      # Compile first and re-print just the compiler errors: a Gradle stack trace
      # buries them hundreds of lines deep otherwise.
      - name: Compile
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain compileDebugKotlin 2>&1 | tee build.log || {
            echo "::group::Kotlin compiler errors"
            grep -E "^e: " build.log | head -80 || true
            echo "::endgroup::"
            echo "::error::Kotlin compilation failed"
            grep -E "^e: " build.log | head -40 || true
            exit 1
          }

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk math-clash.apk

      # Proves the file a phone is about to download will actually install:
      # apksigner exits non-zero when the signature does not verify.
      - name: Inspect the APK
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "using $TOOLS"
          "$TOOLS/aapt2" dump badging math-clash.apk \
            | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:" > apk-info.txt
          "$TOOLS/apksigner" verify --verbose math-clash.apk \
            | grep -E "^Verified|^Number" >> apk-info.txt
          cat apk-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-clash-apk
          path: math-clash.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

      # A stable download link, so the APK can be installed straight from a phone.
      - name: Publish preview release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Math Clash for Android, built from \`${GITHUB_SHA:0:7}\`."
            echo
            echo "Download **math-clash.apk** below and open it on the phone. Android asks once"
            echo "for permission to install from your browser; allow it and the game installs."
            echo
            echo "Needs Android 7.0 or newer. Signed with the repository's preview key, so a"
            echo "newer build installs straight over an older one."
            echo
            echo '```'
            cat apk-info.txt
            echo '```'
          } > release-notes.md
          gh release delete android-preview --yes || true
          git push --force origin HEAD:refs/tags/android-preview
          gh release create android-preview math-clash.apk \
            --title "Math Clash — preview build" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag

      - name: Summary
        if: always()
        run: |
          {
            echo "### Math Clash APK"
            echo ""
            echo "- Artifact: **math-clash-apk** (attached to this run)"
            echo "- Direct install link: https://github.com/${GITHUB_REPOSITORY}/releases/tag/android-preview"
            if [ -f apk-info.txt ]; then
              echo ""
              echo '```'
              cat apk-info.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
